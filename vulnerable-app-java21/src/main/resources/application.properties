# ===========================================================================
#  INTENTIONALLY VULNERABLE TEST TARGET - configuration
# ===========================================================================
server.port=8081
spring.application.name=vulnerable-app-java21

# --- PostgreSQL datasource (primary, as required) -------------------------
spring.datasource.url=jdbc:postgresql://localhost:5434/vulndb
spring.datasource.username=vulnuser
spring.datasource.password=vulnpass
spring.datasource.driver-class-name=org.postgresql.Driver

# Initialise schema + seed data on startup
spring.sql.init.mode=always
spring.sql.init.platform=postgres
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=true
spring.jpa.defer-datasource-initialization=true

# --- Intentional misconfigurations (OWASP A05 / API8) ---------------------
# Full stack traces and internals leaked to clients
server.error.include-message=always
server.error.include-stacktrace=always
server.error.include-binding-errors=always
server.error.include-exception=true

# All actuator endpoints exposed with sensitive data unmasked
management.endpoints.web.exposure.include=*
management.endpoint.env.show-values=always
management.endpoint.configprops.show-values=always
management.endpoint.health.show-details=always

# Verbose SQL logging (information disclosure)
spring.jpa.show-sql=true
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.jdbc.core=TRACE

# Unlimited multipart uploads (API4 unrestricted resource consumption)
spring.servlet.multipart.max-file-size=-1
spring.servlet.multipart.max-request-size=-1

# --- Swagger UI / OpenAPI docs, intentionally OPEN (API9) ------------------
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.display-request-duration=true

# --- Hardcoded secrets (A02 / A07) ----------------------------------------
app.jwt.secret=supersecretkey1234567890supersecretkey
app.api.master-key=MASTER-API-KEY-DO-NOT-SHARE-0001
app.admin.password=admin123
