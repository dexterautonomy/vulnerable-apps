# Convenience profile: run with  -Dspring-boot.run.profiles=h2  (no Postgres needed).
# The app is still fully vulnerable; only the datasource changes.
spring.datasource.url=jdbc:h2:mem:vulndb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.sql.init.platform=h2
spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=true
